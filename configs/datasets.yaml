version: v1
split_ratios: {train: 0.75, val: 0.10, test: 0.15}
stratified: true
image_size: 224
crops:
  tomato:
    root: data/raw/tomato/Variant-a(Multiclass Classification)
    classes:
      - Early_blight
      - Healthy
      - Late_blight
      - Leaf Miner
      - Magnesium Deficiency
      - Nitrogen Deficiency
      - Spotted Wilt Virus
    description: Tomato leaf disease dataset (Variant-a multiclass, 7 classes, pre-existing train/val/test splits)
  potato:
    root: data/raw/potato
    classes: []
    description: Potato leaf disease dataset
  pepper:
    root: data/raw/pepper
    classes: []
    description: Pepper leaf disease dataset
  corn:
    root: data/raw/corn
    classes: []
    description: Corn leaf disease dataset
  grape:
    root: data/raw/grape
    classes: []
    description: Grape leaf disease dataset
preprocessing:
  resize: 256
  center_crop: 224
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
augmentation_version: aug-v1
