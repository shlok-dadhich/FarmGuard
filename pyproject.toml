[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agrovision"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["torch", "torchvision", "pyyaml", "numpy", "Pillow", "pandas", "scikit-learn", "matplotlib", "streamlit"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "ui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
